<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- title/description/og:title are set per-route via each route's head()
         and rendered by <HeadContent /> in __root.tsx (falling back to the
         root route's own head() below) — kept out of here so HeadContent
         owns and replaces them instead of appending a duplicate tag. -->
    <title>ResumeIQ — AI Resume Screening for Recruiters</title>
    <meta name="author" content="ResumeIQ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    />
    <!-- "Sign in with Google" button + credential flow, used on /login and
         /register. Loaded here (not per-route) so the library is warm by
         the time either page renders its button. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
